# spinelgems.org on Upsun — served by a Spinel-compiled Tep binary.
#
# The dogfood arc: the human site + Compact Index are served by a Tep app that
# itself compiles via Spinel (matz/spinel) — built on the Upsun x86 box at
# deploy time. The build hook builds spinel from source (C-only: make deps +
# make all), caches it keyed by the pinned commit, builds tep's C helper .o's,
# then `tep build`s app/serve.rb into a native binary. A CRuby/WEBrick fallback
# keeps the site up if the Tep binary is missing.
#
# ruby:3.4 — bundles prism, which tep's translator (bin/tep) requires.

applications:
  spinelgems:
    type: "ruby:3.4"
    source:
      root: "/"

    dependencies:
      ruby:
        webrick: "*"      # CRuby fallback server

    variables:
      env:
        # Pin spinel + tep to a verified-together PAIR. The build hook compiles
        # the serve binary against tep's C runtime (libspinel_rt.a + sphttp.o),
        # so spinel must be NEW ENOUGH for tep's helper: tep's sphttp.c links
        # sp_net_* (added to libspinel_rt.a at matz/spinel 23ba632, #1055). When
        # tep main advanced past that, the old 8d88ebe pin no longer provided
        # those symbols and the link failed (undefined reference to sp_net_*).
        # SPINEL_PIN now tracks tep's own SPINEL_PIN (the commit tep is verified
        # to build+test against); TEP_PIN freezes tep so a future main advance
        # can't silently break the deploy again. Bump both together.
        # NATIVE PIN BUMP to the latest engine (2026-06-17). The serve path is
        # healthy again at spinel 5959b64 + tep 5c38c93, validated end-to-end
        # locally (helper + `tep build app/serve.rb` + boot + GET / 200 + serves
        # git:478cc93 / 141★). The two regressions that blocked it are resolved:
        #   - the boot SIGSEGV in sp_Response_set_cookie (b60fbd7/478cc93) was a
        #     same-leaf-name Response class collision — fixed by matz/spinel
        #     a266211 (#1422/#1425).
        #   - the residual PG `opts.each` whole-program miscompile (#1434) is in
        #     tep's Postgres adapter, which tep#216 made OPT-IN. This serve uses
        #     Tep::SQLite (catalog.db) only, so PG is out of its compile closure
        #     (serve_bin links libsqlite3 + libssl, NOT libpq) and #1434 can't
        #     bite it. #1434 stays open as a PG-consumer bug.
        # Catalog data is still survey-193k/compat.jsonl @ 478cc93 (build-db,
        # CRuby) — a fresh reprobe at 5959b64 is a follow-up; engine and catalog
        # remain decoupled. Bump SPINEL_PIN+TEP_PIN together as a verified pair.
        SPINEL_PIN: "5959b64e4a231a786d87b704923b4e0451dda3e0"
        TEP_PIN: "5c38c93e05896190898a645cc35a4220b7059f9c"

    hooks:
      build: |
        set -e
        echo "== toolchain =="
        cc --version | head -1 || echo "NO cc"
        make --version | head -1 || echo "NO make"
        ruby -v; ruby -e 'require "prism"; puts "prism #{Prism::VERSION}"' || echo "NO prism"
        which ar git curl tar || true

        PIN="$SPINEL_PIN"
        CACHE="$PLATFORM_CACHE_DIR/spinel-$PIN"
        if [ ! -x "$CACHE/spinel" ]; then
          echo "== building spinel $PIN (cold) =="
          rm -rf "$CACHE"; mkdir -p "$PLATFORM_CACHE_DIR"
          git clone --quiet https://github.com/matz/spinel.git "$CACHE"
          git -C "$CACHE" checkout --quiet "$PIN"
          t0=$(date +%s)
          make -C "$CACHE" deps
          make -C "$CACHE" all
          echo "== spinel built in $(( $(date +%s) - t0 ))s =="
        else
          echo "== spinel cache hit ($CACHE) =="
        fi
        export SPINEL="$CACHE/spinel"
        "$SPINEL" -e 'puts "spinel runs: " + (1+1).to_s' || { echo "spinel smoke FAILED"; exit 1; }

        echo "== fetch tep @ $TEP_PIN =="
        TEPDIR="$PLATFORM_CACHE_DIR/tep"
        if [ ! -d "$TEPDIR/.git" ]; then git clone --quiet https://github.com/OriPekelman/tep.git "$TEPDIR"; fi
        git -C "$TEPDIR" fetch --quiet origin || true
        git -C "$TEPDIR" checkout --quiet "$TEP_PIN"
        # force a clean helper rebuild against the pinned spinel (drop any cached
        # .o from a prior spinel so the sp_net_* link resolves against cc94707)
        rm -f "$TEPDIR"/lib/tep/*.o
        export TEP_SKIP_SPINEL_FRESH=1 TEP_SPINEL_DIR="$CACHE"
        make -C "$TEPDIR" helper

        echo "== build static site (fallback) + catalog DB =="
        ruby exe/spinel-compat build-site --out public
        ruby exe/spinel-compat build-db --out public/catalog.db
        ls -la public/catalog.db

        echo "== compile Tep app =="
        "$TEPDIR/bin/tep" build app/serve.rb -o serve_bin
        echo "== serve_bin =="; ls -la serve_bin; ldd serve_bin || true

    web:
      commands:
        start: |
          if [ -x serve_bin ]; then
            exec ./serve_bin -p $PORT
          else
            exec ruby exe/spinel-compat server --public public --port $PORT
          fi
      upstream:
        socket_family: tcp
      locations:
        "/":
          passthru: true

    mounts: {}

routes:
  "https://{default}/":
    type: upstream
    upstream: "spinelgems:http"
  "https://www.{default}/":
    type: redirect
    to: "https://{default}/"
